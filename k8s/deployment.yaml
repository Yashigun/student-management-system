apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
  namespace: student-ns
  labels:
    app: student-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
        - name: student-management
          image: meowmeow99/student-management-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /students
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
